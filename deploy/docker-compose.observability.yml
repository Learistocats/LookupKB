# LookupKB — opt-in observability overlay (docs/planning/02-tech-stack.md §6).
#
# Bundled telemetry backend so the stack is batteries-included for local dev.
# Merge it onto the core stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#   (or: make obs-up)
#
# It (a) swaps the collector's config for one that fans OTLP out to the backends
# below, (b) starts Prometheus + Tempo + Loki + Grafana, and (c) adds a /grafana
# route to Caddy. NO service publishes a host port — Grafana is reached through
# Caddy at /grafana, so the core stack's "only Caddy is published" boundary holds.
#
# Production deployments skip this overlay and point the collector at their own
# backend instead.

name: lookupkb

services:
  # Swap in the fan-out config (same mount target overrides the base file) and
  # gate on the backends being present.
  otel-collector:
    volumes:
      - ./otel-collector-config.observability.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - prometheus
      - tempo
      - loki

  # Add the /grafana route snippet; keep the core api/web health gates (merged).
  caddy:
    volumes:
      - ./observability/caddy-grafana.caddy:/etc/caddy/conf.d/grafana.caddy:ro
    depends_on:
      grafana:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.1.0@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  tempo:
    image: grafana/tempo:2.7.1@sha256:4443be217c396b065ee34845534199c36fdba4dc619cb96550e228d73fba6e69
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  loki:
    image: grafana/loki:3.4.1@sha256:1d0c5ddc7644b88956aa0bd775ad796d9635180258a225d6ab3552751d5e2a66
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  grafana:
    image: grafana/grafana:11.5.1@sha256:5781759b3d27734d4d548fcbaf60b1180dbf4290e708f01f292faa6ae764c5e6
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      # Served behind Caddy under /grafana — no host port published.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      # edge so Caddy can reach it; data so it can reach the backends.
      - edge
      - data
    depends_on:
      - prometheus
      - tempo
      - loki
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

volumes:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
