# LookupKB single-host Docker Compose stack (see docs/planning/01-architecture.md §5).
#
# Network segmentation: only `caddy` is published to the host. Everything else
# talks over internal networks. `edge` carries browser-facing traffic (Caddy →
# web/api/authentik); `data` carries backend traffic (api/authentik → datastores).
# Datastores sit ONLY on `data`, so they are unreachable from the edge.
#
# Heavy, not-yet-wired services live behind Compose profiles so a default
# `docker compose up` brings a clean core skeleton:
#   (default)        caddy, api, web, postgres, valkey, meilisearch, kroki(+mermaid), garage
#   --profile auth   authentik-server, authentik-worker  (OIDC wiring: later ticket)
#   --profile observability  otel-collector             (telemetry wiring: later ticket)
#
# All third-party images are pinned by digest (updated via Renovate).

name: lookupkb

services:
  # ---- Edge -----------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      # Authentik gets its own hostname so the OIDC issuer is stable end-to-end
      # (see docs/auth-setup.md). In dev *.localhost resolves to 127.0.0.1 in the
      # browser; the network alias below lets the api/web containers reach the
      # same URL via Caddy so the token issuer matches.
      AUTH_SITE_ADDRESS: ${AUTH_SITE_ADDRESS:-http://authentik.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        aliases:
          # Dev default AUTH_SITE_ADDRESS host. Override in production with real
          # DNS (then this alias is unused and harmless).
          - authentik.localhost
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M

  # ---- Application ----------------------------------------------------------
  api:
    build:
      context: ../api
      args:
        VERSION: ${LOOKUPKB_VERSION:-dev}
    image: lookupkb-api:${LOOKUPKB_VERSION:-dev}
    restart: unless-stopped
    environment:
      LOOKUPKB_ENV: ${LOOKUPKB_ENV:-development}
      LOOKUPKB_API_PORT: "8080"
      LOOKUPKB_LOG_LEVEL: ${LOOKUPKB_LOG_LEVEL:-info}
      LOOKUPKB_LOG_FORMAT: ${LOOKUPKB_LOG_FORMAT:-json}
      # Runtime DB connection as the least-privilege app role (DML only). Built
      # from the fixed role name + password so the URL never lands in .env.
      LOOKUPKB_DATABASE_URL: postgres://lookupkb_app:${LOOKUPKB_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-lookupkb}?sslmode=disable
      # OIDC token verification (LOO-8). Empty issuer disables protected routes so
      # the core stack boots without Authentik (--profile auth). Audience is the
      # provider client id. ISSUER_INTERNAL is optional split-horizon discovery.
      LOOKUPKB_OIDC_ISSUER: ${LOOKUPKB_OIDC_ISSUER:-}
      LOOKUPKB_OIDC_ISSUER_INTERNAL: ${LOOKUPKB_OIDC_ISSUER_INTERNAL:-}
      LOOKUPKB_OIDC_AUDIENCE: ${LOOKUPKB_OIDC_AUDIENCE:-}
      # OTLP export target (the collector runs in the core stack). The SDK
      # export itself is wired by a later instrumentation ticket; this only
      # documents the endpoint the API will use.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
      - data
    # Gate the API on its datastores so /readyz (health-endpoints ticket) has a
    # live Postgres/Meili/Garage to reach and startup is deterministic (AC-11.1).
    # The `migrate` one-shot must complete first so the schema exists before the
    # app (which connects as the DML-only role) starts serving.
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      garage:
        condition: service_healthy
      kroki:
        condition: service_started
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 256M

  # One-shot schema migration. Reuses the API image (`api migrate up` runs the
  # embedded goose migrations) and connects as the migration role that owns DDL.
  # `api` waits for this to exit successfully (see its depends_on).
  migrate:
    image: lookupkb-api:${LOOKUPKB_VERSION:-dev}
    build:
      context: ../api
      args:
        VERSION: ${LOOKUPKB_VERSION:-dev}
    command: ["migrate", "up"]
    restart: "no"
    environment:
      LOOKUPKB_ENV: ${LOOKUPKB_ENV:-development}
      LOOKUPKB_LOG_FORMAT: ${LOOKUPKB_LOG_FORMAT:-json}
      LOOKUPKB_MIGRATE_DATABASE_URL: postgres://lookupkb_migrator:${LOOKUPKB_MIGRATOR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-lookupkb}?sslmode=disable
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M

  web:
    build:
      context: ../web
    image: lookupkb-web:${LOOKUPKB_VERSION:-dev}
    restart: unless-stopped
    environment:
      # OIDC BFF (LOO-8). Empty OIDC_ISSUER disables auth so the core stack boots
      # without Authentik. Client id/secret/redirect are shared with the Authentik
      # blueprint via the LOOKUPKB_OIDC_* vars (single source of truth).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${LOOKUPKB_OIDC_CLIENT_ID:-lookupkb}
      OIDC_CLIENT_SECRET: ${LOOKUPKB_OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${LOOKUPKB_OIDC_REDIRECT_URI:-http://localhost/auth/callback}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost/}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email groups}
      # Dev serves plain HTTP, so cookies must not be Secure-only. Never true in prod.
      OIDC_ALLOW_INSECURE: ${OIDC_ALLOW_INSECURE:-true}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:-}
      # Server-side API base for bearer-proxied calls (internal service address).
      API_INTERNAL_BASE: http://api:8080
      # adapter-node: trust Caddy's forwarded proto/host and fix the origin for
      # CSRF/redirect correctness behind the reverse proxy.
      ORIGIN: ${SITE_ADDRESS:-http://localhost}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_started
    # node:slim has no wget/curl; probe with Node's global fetch against the
    # unauthenticated /healthz route.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ---- Data stores ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lookupkb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-lookupkb}
      # Consumed by 20-lookupkb-roles.sh to provision the least-privilege app +
      # migration roles the API and `api migrate` connect as (06-security.md §8).
      LOOKUPKB_APP_DB_PASSWORD: ${LOOKUPKB_APP_DB_PASSWORD:?LOOKUPKB_APP_DB_PASSWORD is required}
      LOOKUPKB_MIGRATOR_DB_PASSWORD: ${LOOKUPKB_MIGRATOR_DB_PASSWORD:?LOOKUPKB_MIGRATOR_DB_PASSWORD is required}
      # Consumed by the init script to provision the Authentik database/role.
      AUTHENTIK_DB: ${AUTHENTIK_DB:-authentik}
      AUTHENTIK_DB_USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?AUTHENTIK_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lookupkb} -d ${POSTGRES_DB:-lookupkb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

  valkey:
    image: valkey/valkey:8-alpine@sha256:94365b275456ae14621001c03556c732b1d93a0cdeacc317d1bdd52eba680885
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - valkey_data:/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  meilisearch:
    image: getmeili/meilisearch:v1.12@sha256:c9fac23131cca4db95173d41cc50fd5639121ee381795528fdd7522d7978a7b8
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    # Meilisearch ships curl; probe over 127.0.0.1 (it binds IPv4 only, and
    # `localhost` resolves to ::1 in the container → connection refused).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  kroki:
    image: yuzutech/kroki:0.28.0@sha256:710a5e8d57344769846695431ceefc02aaf908e9958c9d459171d2255ee2f7f5
    restart: unless-stopped
    environment:
      KROKI_MERMAID_HOST: kroki-mermaid
      # Least privilege: only enable the diagram engines we use.
      KROKI_SAFE_MODE: secure
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    depends_on:
      - kroki-mermaid
    # Probe Kroki's liveness endpoint so the API can gate on a render backend
    # that answers. Use 127.0.0.1 to avoid IPv6-loopback surprises.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  kroki-mermaid:
    image: yuzutech/kroki-mermaid:0.28.0@sha256:e301872d57b397e1020768cfbafd3ac5d3f2c47a2615d65b9af217c832a226f4
    restart: unless-stopped
    expose:
      - "8002"
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  garage:
    image: dxflrs/garage:v1.0.1@sha256:a5706cf1f3d7b349ac5133ec59ad8181b709270b75e5f2fa7b3e1a5c07d67137
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}
      # Bearer tokens for the admin (:3903) and metrics endpoints. Garage reads
      # these from the environment; never bake them into garage.toml.
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is required}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?GARAGE_METRICS_TOKEN is required}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    # The scratch image has only the garage binary; `garage status` connects
    # over RPC and returns healthy once the daemon is up (even pre-layout).
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---- Identity (OIDC wiring is a later ticket) -----------------------------
  authentik-server:
    image: ghcr.io/goauthentik/server:2024.10.5@sha256:c4aa2113d0c2379faa9e8a28f4ab13816b4e6f2847b272e37d68e518fdf76880
    restart: unless-stopped
    profiles: ["auth"]
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?AUTHENTIK_DB_PASSWORD is required}
      AUTHENTIK_REDIS__HOST: valkey
      # First-boot admin bootstrap so there is a usable akadmin account without
      # manual setup. OIDC application/provider config is a later ticket.
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@localhost}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      # Consumed by the LookupKB blueprint (deploy/authentik/blueprints/lookupkb.yaml)
      # to provision the OAuth2 provider without hardcoding secrets.
      LOOKUPKB_OIDC_CLIENT_ID: ${LOOKUPKB_OIDC_CLIENT_ID:-lookupkb}
      LOOKUPKB_OIDC_CLIENT_SECRET: ${LOOKUPKB_OIDC_CLIENT_SECRET:-}
      LOOKUPKB_OIDC_REDIRECT_URI: ${LOOKUPKB_OIDC_REDIRECT_URI:-http://localhost/auth/callback}
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # Authentik ships an `ak healthcheck` command for exactly this purpose.
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.10.5@sha256:c4aa2113d0c2379faa9e8a28f4ab13816b4e6f2847b272e37d68e518fdf76880
    restart: unless-stopped
    profiles: ["auth"]
    command: worker
    environment: *authentik-env
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      # File-based blueprint, auto-discovered and applied on boot.
      - ./authentik/blueprints:/blueprints/lookupkb:ro
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  # ---- Observability --------------------------------------------------------
  # The collector is a core service (01-architecture.md §5.1): the API exports
  # OTLP to it and /readyz probes it. Its base config only logs to `debug`; the
  # opt-in docker-compose.observability.yml overlay swaps in a config that fans
  # out to Prometheus/Tempo/Loki and starts those backends.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1@sha256:d0ebf65280da2e1b1491d1b93648281afd353d4b9ea19160090303cec9a233bd
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  valkey_data:
  meili_data:
  garage_meta:
  garage_data:
  authentik_media:
  authentik_templates:
