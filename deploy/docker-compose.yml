# LookupKB single-host Docker Compose stack.
#
#   web, api (+ one-shot migrate), postgres, valkey, meilisearch, kroki(+mermaid), garage
#
# Network segmentation: `web` is the only browser-facing service (published on
# LOOKUPKB_WEB_PORT); the API port is bound to 127.0.0.1 by default and is only
# needed by a host reverse proxy that exposes the public /api surface. TLS is the
# host proxy's job. Datastores sit ONLY on the internal `data` network.
#
# All third-party images are pinned by digest (updated via Renovate).

name: lookupkb

x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

# Read-only root fs, no capabilities (app containers only).
x-locked: &locked
  <<: *hardened
  read_only: true
  cap_drop:
    - ALL

x-api-image: &api-image ${LOOKUPKB_IMAGE_PREFIX:-}lookupkb-api:${LOOKUPKB_VERSION:-dev}

services:
  # ---- Application ----------------------------------------------------------
  api:
    build:
      context: ../api
      args:
        VERSION: ${LOOKUPKB_VERSION:-dev}
    image: *api-image
    <<: *locked
    environment:
      LOOKUPKB_ENV: ${LOOKUPKB_ENV:-development}
      LOOKUPKB_API_PORT: "8080"
      LOOKUPKB_LOG_LEVEL: ${LOOKUPKB_LOG_LEVEL:-info}
      LOOKUPKB_LOG_FORMAT: ${LOOKUPKB_LOG_FORMAT:-json}
      # Runtime DB connection as the least-privilege app role (DML only). Built
      # from the fixed role name + password so the URL never lands in .env.
      LOOKUPKB_DATABASE_URL: postgres://lookupkb_app:${LOOKUPKB_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-lookupkb}?sslmode=disable
      # Token authentication: the API signs/verifies its own HS256 access tokens
      # with this secret (≥32 bytes). Empty disables signup/login and every
      # protected route.
      LOOKUPKB_AUTH_SECRET: ${LOOKUPKB_AUTH_SECRET:-}
      LOOKUPKB_AUTH_TOKEN_TTL: ${LOOKUPKB_AUTH_TOKEN_TTL:-168h}
      # Shared login/signup rate-limit counters.
      LOOKUPKB_VALKEY_URL: redis://valkey:6379/0
      # Internal service URLs are assembled here (never in .env).
      LOOKUPKB_MEILI_URL: http://meilisearch:7700
      # Indexing + search key (server-side only; never sent to the browser).
      LOOKUPKB_MEILI_KEY: ${MEILI_MASTER_KEY}
      # Browser origins allowed on /mcp (empty: none; native MCP clients need none).
      LOOKUPKB_MCP_ALLOWED_ORIGINS: ${LOOKUPKB_MCP_ALLOWED_ORIGINS:-}
    # Loopback-only by default: the browser talks to `web`, never to the API. Point
    # a host reverse proxy at it (and set LOOKUPKB_API_BIND=0.0.0.0 if that proxy
    # runs elsewhere) to expose the public /api surface.
    ports:
      - "${LOOKUPKB_API_BIND:-127.0.0.1}:${LOOKUPKB_API_PORT:-8080}:8080"
    networks:
      - edge
      - data
    # `migrate` must finish first: the app connects as the DML-only role.
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    # /readyz (not /healthz): healthy only once the dependencies are reachable.
    healthcheck:
      test: ["CMD", "/api", "readycheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 256M

  # One-shot schema migration with the API image (built by `api`), connecting as
  # the DDL-owning role.
  migrate:
    image: *api-image
    <<: *locked
    command: ["migrate", "up"]
    restart: "no"
    environment:
      LOOKUPKB_ENV: ${LOOKUPKB_ENV:-development}
      LOOKUPKB_LOG_FORMAT: ${LOOKUPKB_LOG_FORMAT:-json}
      LOOKUPKB_MIGRATE_DATABASE_URL: postgres://lookupkb_migrator:${LOOKUPKB_MIGRATOR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-lookupkb}?sslmode=disable
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M

  web:
    build:
      context: ../web
    image: ${LOOKUPKB_IMAGE_PREFIX:-}lookupkb-web:${LOOKUPKB_VERSION:-dev}
    <<: *locked
    tmpfs:
      - /tmp
    environment:
      # Seals the API token into the session cookie. Empty disables auth (the
      # web app then serves openly, for `pnpm dev`-style setups only).
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:-}
      # Plain-http local use needs non-Secure cookies. Set false behind HTTPS.
      SESSION_COOKIE_INSECURE: ${SESSION_COOKIE_INSECURE:-true}
      # adapter-node: the public origin, for CSRF/redirect correctness. Set it to
      # your https URL when a host proxy terminates TLS in front of this service.
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      # The client IP (for login rate limiting) as seen behind a host proxy. Leave
      # empty when browsers connect to this port directly.
      ADDRESS_HEADER: ${WEB_ADDRESS_HEADER:-}
      XFF_DEPTH: ${WEB_XFF_DEPTH:-1}
    ports:
      - "${LOOKUPKB_WEB_BIND:-0.0.0.0}:${LOOKUPKB_WEB_PORT:-3000}:8080"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    # node:slim has no wget/curl; probe with Node's global fetch against the
    # unauthenticated /healthz route.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ---- Data stores ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    <<: *hardened
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lookupkb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-lookupkb}
      # Consumed by 20-lookupkb-roles.sh to provision the least-privilege app +
      # migration roles the API and `api migrate` connect as.
      LOOKUPKB_APP_DB_PASSWORD: ${LOOKUPKB_APP_DB_PASSWORD:?LOOKUPKB_APP_DB_PASSWORD is required}
      LOOKUPKB_MIGRATOR_DB_PASSWORD: ${LOOKUPKB_MIGRATOR_DB_PASSWORD:?LOOKUPKB_MIGRATOR_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lookupkb} -d ${POSTGRES_DB:-lookupkb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

  valkey:
    image: valkey/valkey:8-alpine@sha256:94365b275456ae14621001c03556c732b1d93a0cdeacc317d1bdd52eba680885
    <<: *hardened
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - valkey_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  meilisearch:
    image: getmeili/meilisearch:v1.12@sha256:c9fac23131cca4db95173d41cc50fd5639121ee381795528fdd7522d7978a7b8
    <<: *hardened
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - data
    # Meilisearch ships curl; probe over 127.0.0.1 (it binds IPv4 only, and
    # `localhost` resolves to ::1 in the container → connection refused).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  kroki:
    image: yuzutech/kroki:0.28.0@sha256:710a5e8d57344769846695431ceefc02aaf908e9958c9d459171d2255ee2f7f5
    <<: *hardened
    environment:
      KROKI_MERMAID_HOST: kroki-mermaid
      # Least privilege: only enable the diagram engines we use.
      KROKI_SAFE_MODE: secure
    networks:
      - data
    depends_on:
      - kroki-mermaid
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  kroki-mermaid:
    image: yuzutech/kroki-mermaid:0.28.0@sha256:e301872d57b397e1020768cfbafd3ac5d3f2c47a2615d65b9af217c832a226f4
    <<: *hardened
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    <<: *hardened
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required}
      # Bearer tokens for the admin (:3903) and metrics endpoints. Garage reads
      # these from the environment; never bake them into garage.toml.
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is required}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?GARAGE_METRICS_TOKEN is required}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - data
    # The scratch image has only the garage binary; `garage status` connects
    # over RPC and returns healthy once the daemon is up (even pre-layout).
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  valkey_data:
  meili_data:
  garage_meta:
  garage_data:
