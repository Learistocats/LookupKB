# Prometheus scrape config for the bundled observability overlay.
# The only target is the OTel Collector's Prometheus exporter, which exposes
# the metrics the API sends over OTLP (see otel-collector-config.observability.yaml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
