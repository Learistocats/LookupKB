# Grafana datasource provisioning for the observability overlay.
# Preloaded dashboards with the test-book AC budgets land with the API
# instrumentation ticket (the API emits no OTLP yet); this wires the three
# datasources so they are green the moment metrics/traces/logs start flowing.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
