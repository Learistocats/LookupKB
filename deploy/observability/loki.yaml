# Grafana Loki — single-binary local logs backend for the observability overlay.
# Accepts logs over Loki's native OTLP endpoint (/otlp/v1/logs) from the collector.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required so OTLP resource/scope attributes ingest as structured metadata.
  allow_structured_metadata: true
