name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: api/go.sum

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: api

      - name: sqlc generate is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.28.0
          sqlc generate
          git diff --exit-code || {
            echo "::error::sqlc output is stale — run 'make sqlc' and commit the result";
            exit 1;
          }

      - name: Test
        run: go test -race ./...

      - name: Migrations apply up and down (testcontainers)
        run: go test -tags integration -race ./internal/db/...

      - name: Build
        run: go build ./...

  vuln:
    name: Govulncheck (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: api/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

  web:
    name: Web (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose -f deploy/docker-compose.yml --env-file .env config -q
          echo "core compose config OK"
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.observability.yml --env-file .env config -q
          echo "observability overlay config OK"

  trivy-config:
    name: Trivy (IaC/config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans Dockerfiles + docker-compose for misconfigurations. Fails the build
      # on HIGH/CRITICAL; accepted findings go in .trivyignore (documented there).
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t lookupkb-api:ci ./api

      - name: Build web image
        run: docker build -t lookupkb-web:ci ./web

      # Scan the images we just built (no rebuild). ignore-unfixed keeps CI
      # green-able against base-image CVEs with no upstream fix yet; HIGH/CRITICAL
      # fixable findings fail the build.
      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lookupkb-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Trivy scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lookupkb-web:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
