name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # PRs are squash-merged, so the title becomes the commit release-please
      # reads: it must follow Conventional Commits (see CONTRIBUTING.md).
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - name: Verify modules
        run: go mod verify

      - name: go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: api

      - name: sqlc generate is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.28.0
          sqlc generate
          git diff --exit-code || {
            echo "::error::sqlc output is stale — run 'make sqlc' and commit the result";
            exit 1;
          }

      - name: Test
        run: go test -race ./...

      - name: Migrations apply up and down (testcontainers)
        run: go test -tags integration -race ./internal/db/...

      - name: Build
        run: go build ./...

  vuln:
    name: Govulncheck (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

  web:
    name: Web (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on HIGH/CRITICAL advisories. Not --prod: SvelteKit apps bundle their
      # framework from devDependencies, so those ship too. Transitive fixes go in
      # pnpm-workspace.yaml `overrides`.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose -f deploy/docker-compose.yml --env-file .env config -q
          echo "compose config OK"

  trivy-config:
    name: Trivy (IaC/config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Scans Dockerfiles + docker-compose for misconfigurations. Fails the build
      # on HIGH/CRITICAL; accepted findings go in .trivyignore (documented there).
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build -t lookupkb-api:ci ./api

      - name: Build web image
        run: docker build -t lookupkb-web:ci ./web

      # Scan the images we just built (no rebuild). ignore-unfixed keeps CI
      # green-able against base-image CVEs with no upstream fix yet; HIGH/CRITICAL
      # fixable findings fail the build.
      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lookupkb-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Trivy scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lookupkb-web:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
