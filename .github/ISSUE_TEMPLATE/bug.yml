name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Please **don't** file it here — see [SECURITY.md](https://github.com/Learistocats/LookupKB/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in
        2. Create an entry with …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit (the API reports it at `/healthz`).
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Deployment (compose / local dev), OS, browser.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets and personal data.
      render: shell
