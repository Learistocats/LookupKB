# sqlc generates type-safe Go from SQL. The schema source
# is the goose migrations themselves, so generated types can never drift from the
# applied schema. Regenerate with `make sqlc`; CI fails if the committed output
# is stale.
version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: dbgen
        out: internal/db/dbgen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
