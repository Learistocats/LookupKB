# pnpm reads build-script approvals here (not from package.json's "pnpm" field).
# esbuild ships its native binary via a postinstall, so it must be allowed to
# run build scripts.
allowBuilds:
  esbuild: true

# Security overrides for transitive deps whose parents still pin a vulnerable
# range. Drop each once upstream catches up.
overrides:
  cookie: ^0.7.2 # GHSA-pxg6-pf52-xh8x, via @sveltejs/kit
